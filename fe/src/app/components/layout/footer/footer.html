<!-- ===================================================================
     FOOTER – Chân trang website FLEURÉ
     Hiển thị: thông tin cửa hàng, giờ mở cửa, điều hướng nhanh, bản quyền.
     Template thuần tĩnh — không có logic, dùng routerLink cho điều hướng.
=================================================================== -->
<footer class="footer">
  <!-- Tên thương hiệu và slogan -->
  <h3>FLEURÉ – Flower Boutique</h3>
  <p class="slogan">Gói chút hoa, gửi chút thương.</p>

  <!-- Thông tin liên hệ: địa chỉ, điện thoại, giờ mở cửa -->
  <div class="footer-contact">
    <div class="footer-meta-row">
      <app-icon name="map-pin" [size]="14" />
      <span>45 Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh</span>
    </div>
    <div class="footer-meta-row">
      <app-icon name="phone" [size]="14" />
      <span>0909 123 456</span>
      <span class="meta-dot" aria-hidden="true">&bull;</span>
      <app-icon name="clock" [size]="14" />
      <span>07:30 – 21:00 mỗi ngày</span>
    </div>
  </div>

  <!-- Điều hướng nhanh đến các trang chính (aria-label cho screen reader) -->
  <nav class="footer-links" aria-label="Điều hướng chân trang">
    <a routerLink="/">Trang chủ</a>
    <a routerLink="/products">Sản phẩm</a>
    <a routerLink="/promotions">Khuyến mãi</a>
    <a routerLink="/bai_viet">Bài viết</a>
    <a routerLink="/experience">Trải nghiệm</a>
    <a routerLink="/cart">Giỏ hàng</a>
  </nav>

  <!-- Bản quyền -->
  <div class="copyright">
    © 2026 FLEURÉ Flower Boutique &bull; Tinh hoa hoa tươi nghệ thuật
  </div>
</footer>
